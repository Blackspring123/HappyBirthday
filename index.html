
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Thuý Vy 💗</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  height: 100vh;
  font-family: 'Trebuchet MS', sans-serif;
  background: linear-gradient(
    135deg,
    #ffe0ef,
    #e8dfff,
    #dff5ff
  );
  color: #fff;
}

/* Nền */
.background {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, #fff8 0 2px, transparent 4px),
    radial-gradient(circle at 80% 30%, #fff9 0 3px, transparent 5px);
  background-size: 100px 100px;
  animation: sparkle 4s infinite alternate;
}

@keyframes sparkle {
  from { opacity: .5; }
  to { opacity: 1; }
}

/* Nội dung chính */
.container {
  position: relative;
  z-index: 5;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.subtitle {
  font-size: 18px;
  color: #b65c99;
  letter-spacing: 4px;
  animation: fadeIn 2s ease;
}

h1 {
  font-size: clamp(35px, 8vw, 75px);
  color: #ff70ae;
  text-shadow:
    0 3px 0 #fff,
    0 7px 15px #d85caa88;
  margin: 15px 0;
  animation: bounce 2s infinite;
}

.name {
  font-size: clamp(30px, 7vw, 60px);
  color: #a66bd7;
  text-shadow: 0 0 20px white;
  margin-bottom: 15px;
}

.heart {
  display: inline-block;
  animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
  50% { transform: scale(1.3); }
}

@keyframes bounce {
  50% { transform: translateY(-10px); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Bánh sinh nhật */
.cake {
  position: relative;
  width: 180px;
  height: 130px;
  margin-top: 25px;
  animation: cakeFloat 3s ease-in-out infinite;
  filter: drop-shadow(0 12px 10px #b76caa55);
}

@keyframes cakeFloat {
  50% { transform: translateY(-12px); }
}

.cake-top {
  position: absolute;
  width: 180px;
  height: 45px;
  top: 25px;
  background: #fff0f6;
  border-radius: 50%;
  border: 4px solid #ffb8d5;
  z-index: 2;
}

.cake-body {
  position: absolute;
  width: 180px;
  height: 75px;
  top: 45px;
  border-radius: 12px 12px 25px 25px;
  background: linear-gradient(90deg,#ff9bc6,#ffd1e4,#ff9bc6);
  box-shadow: inset 0 -12px 0 #ee85b5;
}

.cake-body::before {
  content: "💗 💗 💗";
  position: absolute;
  width: 100%;
  text-align: center;
  top: 28px;
  font-size: 17px;
}

.candle {
  position: absolute;
  width: 9px;
  height: 45px;
  background: repeating-linear-gradient(
    45deg,
    white 0 5px,
    #ff80ae 5px 10px
  );
  top: -20px;
  left: 85px;
  z-index: 3;
  border-radius: 4px;
}

.flame {
  position: absolute;
  width: 18px;
  height: 25px;
  background: radial-gradient(ellipse, #fff9a6, #ff9e42);
  border-radius: 50% 50% 50% 50%;
  top: -26px;
  left: -4px;
  animation: flicker .3s infinite alternate;
  box-shadow: 0 0 20px #ffba4b;
}

@keyframes flicker {
  to { transform: scale(.8) rotate(8deg); }
}

/* Bóng bay */
.balloon {
  position: fixed;
  width: 65px;
  height: 82px;
  border-radius: 50%;
  z-index: 2;
  animation: floatUp linear infinite;
  box-shadow: inset -12px -10px 15px #0002,
              inset 10px 8px 15px #fff7;
}

.balloon::before {
  content: "";
  position: absolute;
  bottom: -9px;
  left: 28px;
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 12px solid currentColor;
}

.balloon::after {
  content: "";
  position: absolute;
  width: 1px;
  height: 110px;
  background: #ffffffaa;
  top: 88px;
  left: 32px;
}

@keyframes floatUp {
  from { transform: translateY(110vh) rotate(-10deg); }
  to { transform: translateY(-150px) rotate(10deg); }
}

/* Chữ rơi */
.falling {
  position: fixed;
  top: -60px;
  z-index: 4;
  pointer-events: none;
  white-space: nowrap;
  color: #ec66a5;
  font-weight: bold;
  text-shadow: 0 2px 8px white;
  animation: fall linear forwards;
}

@keyframes fall {
  0% {
    transform: translateY(-50px) rotate(-15deg);
    opacity: 0;
  }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% {
    transform: translateY(110vh) rotate(25deg);
    opacity: 0;
  }
}

/* Nút */
button {
  margin-top: 28px;
  border: none;
  padding: 14px 30px;
  border-radius: 50px;
  background: linear-gradient(45deg,#ff75ac,#b987ec);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 7px 20px #cf78c777;
  transition: .3s;
}

button:hover {
  transform: scale(1.1);
}

/* Pháo hoa */
canvas {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.footer {
  margin-top: 15px;
  color: #b56a9e;
  font-size: 14px;
}

@media(max-width: 480px) {
  .balloon { transform: scale(.75); }
  .subtitle { font-size: 13px; }
}
</style>
</head>

<body>

<div class="background"></div>
<canvas id="fireworks"></canvas>

<div class="container">
  <div class="subtitle">A SPECIAL DAY FOR YOU ✨</div>

  <h1>HAPPY BIRTHDAY</h1>

  <div class="name">
    Thuý Vy <span class="heart">💗</span>
  </div>

  <div class="cake">
    <div class="cake-top"></div>
    <div class="cake-body"></div>
    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

  <button onclick="celebrate()">
    🎁 Nhấn vào đây nè!
  </button>

  <div class="footer">
    Made with love for Thuý Vy 💕
  </div>
</div>

<script>
// Tạo bóng bay 3D
const colors = [
  "#ff91bb", "#bca2ff", "#91dfff",
  "#ffcf8e", "#a8e9d0", "#ffa8d8"
];

function createBalloon() {
  const balloon = document.createElement("div");
  balloon.className = "balloon";

  const color = colors[
    Math.floor(Math.random() * colors.length)
  ];

  balloon.style.background = color;
  balloon.style.color = color;
  balloon.style.left = Math.random() * 100 + "vw";
  balloon.style.animationDuration =
    (8 + Math.random() * 8) + "s";

  balloon.style.animationDelay =
    Math.random() * 3 + "s";

  balloon.style.transform =
    `scale(${0.6 + Math.random() * 0.6})`;

  document.body.appendChild(balloon);

  setTimeout(() => balloon.remove(), 18000);
}

setInterval(createBalloon, 650);

// Những lời chúc rơi
const wishes = [
  "Luôn khoẻ mạnh nhé! 💗",
  "Chúc Thuý Vy đậu NV1 !! 🎓",
  "Cô gái xinh đẹp, dễ thương 💗",
  "Sinh nhật vui vẻ! 🎂",
  "Chúc mừng sinh nhật! 🎉",
  "HAPPY BIRTHDAY 💗",
  "Tuổi mới thật nhiều niềm vui ✨",
  "Mãi luôn rạng rỡ nhé 🌸"
  "Thuý Vy đẹp gái quáa"
  "30đ Toán-Lí-Hoá THPT 2027"
  "Xinh gái tinh quái thơm em cái"
  "Luôn vui vẻ và yêu đời nhó"
];

function createWish() {
  const wish = document.createElement("div");
  wish.className = "falling";

  wish.innerText =
    wishes[Math.floor(Math.random() * wishes.length)];

  wish.style.left = Math.random() * 85 + "vw";
  wish.style.fontSize =
    (15 + Math.random() * 9) + "px";

  const duration = 5 + Math.random() * 5;
  wish.style.animationDuration = duration + "s";

  document.body.appendChild(wish);

  setTimeout(() => wish.remove(), duration * 1000);
}

setInterval(createWish, 650);

// Pháo hoa
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

function firework(x, y) {
  const colors = [
    "#ff83b8", "#fff2a6", "#bca2ff",
    "#a5e9ff", "#ffb0dd"
  ];

  for (let i = 0; i < 65; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1,
      color: colors[
        Math.floor(Math.random() * colors.length)
      ],
      size: Math.random() * 3 + 1
    });
  }
}

function animateFireworks() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, index) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.alpha -= 0.012;

    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

    if (p.alpha <= 0) {
      particles.splice(index, 1);
    }
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(animateFireworks);
}

animateFireworks();

// Pháo hoa ngẫu nhiên
setInterval(() => {
  firework(
    Math.random() * canvas.width,
    Math.random() * canvas.height * 0.55
  );
}, 1300);

// Khi nhấn nút
function celebrate() {
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      firework(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.6
      );
    }, i * 250);
  }

  for (let i = 0; i < 15; i++) {
    setTimeout(createWish, i * 120);
  }

  alert(
    "💗 HAPPY BIRTHDAY THUÝ VY 30/10/2026💗\n\n" +
    "Hii! Lời chúc sinh nhật muộn từ Mxun, moaww\n" +
    "Chúc Thuý Vy một tủi mới mới hơn tủi cũ! Sẽ luôn mạnh khoẻ, yêu đời, yêu mình. Tuổi 18 sẽ đến với cổ thiệt rực rỡ, thành công và đạt được ước mơ của mình nhée! Cố lên!!\n" +
    "Cô gái xinh đẹp, dễ thương 💗\n" +
    "Chúc mừng sinh nhật! 🎂"
  );
}

// Pháo hoa mở màn
setTimeout(() => {
  firework(
    window.innerWidth / 2,
    window.innerHeight / 3
  );
}, 500);

</script>

</body>
</html>
